<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppies!</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>please Note: First Name, Last Name, and Email are required.</p>

    <form method="get">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" placeholder="firstName">

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" placeholder="lastName">
        <p></p>

        <label for ="email">Email:</label>
        <input type="email" id="email" placeholder="name@email.com">

        <label for ="password">Password:</label>

        <p>are you over the age of 18?</p>

        <label for="yes">Yes</label>
        <input type="radio" id="yes" name="Over18" value="yesOver">

        <label for="no">No</label>
        <input type="radio" id="no" name="Over18" value="noOver">

        <p>DO you ahve a Credit Card or Paypal?</p>
        <select name = "payment">
            <option value="creditCard">Credit Card</option>
            <option value="paypal">Paypal</option>

        </select>

        <p></p>
        <input type="submit" name="submitted" value="SubmitFeedback">






    </form>
    
</body>
</html>
